name: Compilation VST3 Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Configurer CMake natif
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      - name: Configurer le projet et Telecharger JUCE
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compiler le Plugin
        run: cmake --build build --config Release --target NoteDetector_VST3

      - name: Sauvegarder le fichier VST3
        uses: actions/upload-artifact@v4
        with:
          name: MonPluginGuitare-VST3
          path: build/NoteDetector_artefacts/Release/VST3/NoteDetector.vst3
