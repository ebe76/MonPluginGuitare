name: Compilation VST3 Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Recuperer votre code source
        uses: actions/checkout@v4

      - name: Telecharger le framework JUCE en securite
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: '7.0.5'
          path: JUCE

      - name: Configurer CMake natif
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25.x'

      # CORRECTION : On compile dans "build_propre" pour écraser le bug de l'archive
      - name: Configurer le projet
        run: cmake -B build_propre -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compiler le Plugin
        run: cmake --build build_propre --config Release --target NoteDetector_VST3

      - name: Sauvegarder le fichier VST3
        uses: actions/upload-artifact@v4
        with:
          name: MonPluginGuitare-VST3
          path: build_propre/NoteDetector_artefacts/Release/VST3/NoteDetector.vst3
